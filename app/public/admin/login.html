<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Admin Panel</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand"><svg class="ic-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg> Admin Panel</div>
      <p class="login-sub">Sign in to manage coffee shop orders.</p>
      <label class="field">
        <span>Username</span>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
    </form>
  </main>
  <script src="/js/ikon.js"></script>
<script src="/js/admin-core.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
